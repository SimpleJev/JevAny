<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Observed letter-readout accuracy change versus native pointer</title>
  <desc id="desc">Accuracy-point deltas for letter-only and a fixed fifty-fifty letter-pointer blend. On JevBench public, 4B gains 1.30 and 1.73 points, while 27B gains 0.00 and 0.43. On Transfer-v9, 4B loses 3.44 and 0.10, while 27B loses 2.01 and gains 0.67. No positive delta is statistically significant at the 0.05 level.</desc>
  <rect width="1000" height="500" rx="18" fill="#ffffff"/>
  <style>
    text{font-family:'DejaVu Sans',Arial,sans-serif}.title{font-weight:700;font-size:25px;fill:#213248}.sub{font-size:14px;fill:#64748b}.axis{font-size:12px;fill:#64748b}.group{font-weight:700;font-size:14px;fill:#213248}.small{font-size:12px;fill:#64748b}.value{font-weight:700;font-size:12px;fill:#213248}.grid{stroke:#e4e9ef;stroke-width:1}.zero{stroke:#64748b;stroke-width:1.5}
  </style>
  <text class="title" x="34" y="38">Observed accuracy change by readout</text>
  <text class="sub" x="34" y="64">Accuracy-point change from the same checkpoint's native pointer · higher is better</text>
  <rect x="696" y="29" width="13" height="13" rx="2" fill="#8b5cf6"/><text class="small" x="718" y="40">Letter</text>
  <rect x="790" y="29" width="13" height="13" rx="2" fill="#14b8a6"/><text class="small" x="812" y="40">50/50 blend</text>

  <line class="grid" x1="76" y1="110" x2="958" y2="110"/><text class="axis" x="64" y="114" text-anchor="end">+2</text>
  <line class="grid" x1="76" y1="160" x2="958" y2="160"/><text class="axis" x="64" y="164" text-anchor="end">+1</text>
  <line class="zero" x1="76" y1="210" x2="958" y2="210"/><text class="axis" x="64" y="214" text-anchor="end">0</text>
  <line class="grid" x1="76" y1="260" x2="958" y2="260"/><text class="axis" x="64" y="264" text-anchor="end">−1</text>
  <line class="grid" x1="76" y1="310" x2="958" y2="310"/><text class="axis" x="64" y="314" text-anchor="end">−2</text>
  <line class="grid" x1="76" y1="360" x2="958" y2="360"/><text class="axis" x="64" y="364" text-anchor="end">−3</text>
  <line class="grid" x1="76" y1="410" x2="958" y2="410"/><text class="axis" x="64" y="414" text-anchor="end">−4</text>

  <rect x="151" y="145" width="34" height="65" rx="4" fill="#8b5cf6"/><text class="value" x="168" y="137" text-anchor="middle">+1.30</text>
  <rect x="191" y="123.5" width="34" height="86.5" rx="4" fill="#14b8a6"/><text class="value" x="208" y="115.5" text-anchor="middle">+1.73</text>

  <rect x="371" y="207" width="34" height="3" rx="1.5" fill="#8b5cf6"/><text class="value" x="388" y="197" text-anchor="middle">0.00</text>
  <rect x="411" y="188.5" width="34" height="21.5" rx="4" fill="#14b8a6"/><text class="value" x="428" y="180.5" text-anchor="middle">+0.43</text>

  <rect x="591" y="210" width="34" height="172" rx="4" fill="#8b5cf6"/><text class="value" x="608" y="398" text-anchor="middle">−3.44</text>
  <rect x="631" y="210" width="34" height="5" rx="2.5" fill="#14b8a6"/><text class="value" x="648" y="231" text-anchor="middle">−0.10</text>

  <rect x="811" y="210" width="34" height="100.4" rx="4" fill="#8b5cf6"/><text class="value" x="828" y="326.4" text-anchor="middle">−2.01</text>
  <rect x="851" y="176.5" width="34" height="33.5" rx="4" fill="#14b8a6"/><text class="value" x="868" y="168.5" text-anchor="middle">+0.67</text>

  <text class="group" x="188" y="440" text-anchor="middle">JevBench public · 4B</text><text class="small" x="188" y="458" text-anchor="middle">231 decisions</text>
  <text class="group" x="408" y="440" text-anchor="middle">JevBench public · 27B</text><text class="small" x="408" y="458" text-anchor="middle">231 decisions</text>
  <text class="group" x="628" y="440" text-anchor="middle">Transfer-v9 · 4B</text><text class="small" x="628" y="458" text-anchor="middle">1,046 knowable decisions</text>
  <text class="group" x="848" y="440" text-anchor="middle">Transfer-v9 · 27B</text><text class="small" x="848" y="458" text-anchor="middle">1,046 knowable decisions</text>
  <text class="small" x="500" y="485" text-anchor="middle">Exact matched runs · T=1 · fixed blend 0.5 · no positive delta is significant at α=.05</text>
</svg>
