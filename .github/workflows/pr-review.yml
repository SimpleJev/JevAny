name: PR review

on:
  workflow_run:
    workflows: [ci, Deploy homepage, PR review signal]
    types: [in_progress, completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every event rescans open PRs, so coalescing queued events loses no PR updates.
concurrency:
  group: pr-review-controller
  cancel-in-progress: false

jobs:
  evaluate:
    # Forks can run the rule tests; only upstream publishes regular reviews.
    if: github.repository == 'SimpleJev/JevAny'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/review/requirements.txt
      - name: Collect evidence and review as data
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_REVIEW_PROVIDER: ${{ vars.PR_REVIEW_PROVIDER || 'openai' }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
          PR_REVIEW_MODE: ${{ vars.PR_REVIEW_MODE || 'report-only' }}
        run: python .github/review/review.py evaluate --output review-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-review-result
          path: review-result.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/review/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-review-result
          path: review-artifact
      - name: Recheck commits and CI, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REVIEW_MODE: ${{ vars.PR_REVIEW_MODE || 'report-only' }}
        run: python .github/review/review.py publish --input review-artifact/review-result.json
