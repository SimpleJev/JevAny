name: Deploy homepage
run-name: ${{ github.event_name == 'pull_request' && format('PR #{0} | base {1} | head {2}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0} {1}', github.event_name, github.sha) }}

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'results/**'
      - 'reports/**'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'examples/**'
      - 'recipes/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'results/**'
      - 'reports/**'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'examples/**'
      - 'recipes/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r site/tools/requirements.txt
      - run: python site/tests/content_checks.py
      - run: python site/tools/build_content.py
      - run: python site/tests/check_site.py
      - run: python -m pip install -r site/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python site/tests/browser_checks.py
      - name: Stage public files
        run: |
          mkdir -p _site
          cp site/index.html site/zh.html site/styles.css site/app.js site/language.js site/robots.txt site/sitemap.xml _site/
          cp -r site/assets site/docs site/files _site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
