name: Review workflow tests

on:
  push:
    paths: ['.github/review/**', '.github/workflows/pr-review*.yml']
  pull_request:
    paths: ['.github/review/**', '.github/workflows/pr-review*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/review/requirements.txt PyYAML==6.0.2
      - name: Test policy, CI evidence, publication and workflow boundaries
        run: python -m unittest discover -s .github/review/tests -v
